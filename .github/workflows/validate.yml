name: Validate

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile project
        run: python -m compileall scraper.py core services scripts

      - name: Run tests
        run: pytest --cov=. --cov-report=term-missing:skip-covered -q
