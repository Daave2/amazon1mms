name: Extract Metrics Window

on:
  workflow_dispatch:
    inputs:
      stores:
        description: Comma-separated configured store names. Leave blank for all stores with merchant ids.
        required: false
        default: ""
        type: string
      window_preset:
        description: Named date window to extract
        required: true
        default: today
        type: choice
        options:
          - today
          - yesterday
          - this_week
          - last_7_days
          - custom
      custom_start:
        description: Custom start in Europe/London, e.g. 2026-04-07 00
        required: false
        default: ""
        type: string
      custom_end:
        description: Custom end in Europe/London, e.g. 2026-04-07 12
        required: false
        default: ""
        type: string
      focus_store:
        description: Store to highlight against the full network export
        required: false
        default: Morrisons Thornton Cleveleys
        type: string
  schedule:
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
    - cron: "30 18 * * *"
    - cron: "30 19 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  UK_TARGET_TIMES: "11:00 14:00 17:00 19:30"
  DEFAULT_FOCUS_STORE: "Morrisons Thornton Cleveleys"
  LOGIN_URL: ${{ secrets.LOGIN_URL }}
  LOGIN_EMAIL: ${{ secrets.LOGIN_EMAIL }}
  LOGIN_PASSWORD: ${{ secrets.LOGIN_PASSWORD }}
  OTP_SECRET_KEY: ${{ secrets.OTP_SECRET_KEY }}
  TARGET_URL: ${{ secrets.TARGET_URL || 'https://sellercentral.amazon.co.uk/snowdash/ref=xx_shopdash_dnav_xx' }}
  FORM_POST_URL: ${{ secrets.FORM_POST_URL || 'https://docs.google.com/forms/d/e/1FAIpQLSefktpkvAEYtT8pgYknAdWH_GmopNb-QLrmtTS-ijrBTc1hew/formResponse' }}
  CHAT_WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}

jobs:
  check-time:
    runs-on: ubuntu-latest
    outputs:
      run_job: ${{ steps.check_time.outputs.run_job }}
      current_uk_time: ${{ steps.check_time.outputs.current_uk_time }}
      gate_reason: ${{ steps.check_time.outputs.gate_reason }}

    steps:
      - name: Check current UK time against target slots
        id: check_time
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run_job=true" >> $GITHUB_OUTPUT
            echo "current_uk_time=manual" >> $GITHUB_OUTPUT
            echo "gate_reason=manual_dispatch" >> $GITHUB_OUTPUT
            {
              echo "## Run Gate"
              echo ""
              echo "- Trigger: \`workflow_dispatch\`"
              echo "- Decision: run extractor"
            } >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          CURRENT_UK_TIME=$(TZ="Europe/London" date +'%H:%M')
          echo "Current UK time is: ${CURRENT_UK_TIME}"
          echo "Target times are: ${{ env.UK_TARGET_TIMES }}"
          echo "current_uk_time=${CURRENT_UK_TIME}" >> $GITHUB_OUTPUT

          if [[ " ${{ env.UK_TARGET_TIMES }} " =~ " ${CURRENT_UK_TIME} " ]]; then
            echo "run_job=true" >> $GITHUB_OUTPUT
            echo "gate_reason=scheduled_window_match" >> $GITHUB_OUTPUT
            DECISION="run extractor"
          else
            echo "run_job=false" >> $GITHUB_OUTPUT
            echo "gate_reason=scheduled_window_skip" >> $GITHUB_OUTPUT
            DECISION="skip extractor"
          fi

          {
            echo "## Run Gate"
            echo ""
            echo "- Trigger: \`schedule\`"
            echo "- Current London time: \`${CURRENT_UK_TIME}\`"
            echo "- Allowed times: \`${{ env.UK_TARGET_TIMES }}\`"
            echo "- Decision: ${DECISION}"
          } >> $GITHUB_STEP_SUMMARY

  extract:
    needs: check-time
    if: needs.check-time.outputs.run_job == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser
        run: python -m playwright install chromium

      - name: Download Persistent Data (Fast Path Cache)
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: run-scraper.yml
          name: persistent-discovery-data
          path: .
          if_no_artifact_found: warn
          search_artifacts: true

      - name: Download auth state from previous run
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: run-scraper.yml
          name: auth-state
          path: .
          if_no_artifact_found: warn
          search_artifacts: true

      - name: Ensure auth state is valid
        run: |
          python - <<'PY'
          import asyncio
          from pathlib import Path

          from playwright.async_api import async_playwright

          from core.config import load_settings
          from core.utils import optimize_browser_context, safe_close
          from services.auth_service import check_if_login_needed, prime_master_session

          async def main():
              settings = load_settings()
              state_path = Path(settings.storage_state_path)

              async with async_playwright() as playwright:
                  browser = await playwright.chromium.launch(headless=True)
                  try:
                      session_valid = False
                      if state_path.exists():
                          context = await browser.new_context(storage_state=str(state_path))
                          await optimize_browser_context(context, settings)
                          page = await context.new_page()
                          try:
                              session_valid = not await check_if_login_needed(page, settings.base_dashboard_url, settings)
                          finally:
                              await safe_close(page, "Extract auth check page")
                              await safe_close(context, "Extract auth check context")

                      if session_valid:
                          print("Existing auth state is valid.")
                          return

                      print("Auth state missing or expired. Priming a fresh session.")
                      success = await prime_master_session(browser, settings)
                      if not success:
                          raise RuntimeError("Failed to prime a fresh auth session for extract workflow.")
                  finally:
                      await safe_close(browser, "Extract auth browser")

          asyncio.run(main())
          PY

      - name: Run metrics window extractor
        env:
          INPUT_STORES: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.stores || '' }}
          INPUT_WINDOW_PRESET: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.window_preset || 'today' }}
          INPUT_CUSTOM_START: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.custom_start || '' }}
          INPUT_CUSTOM_END: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.custom_end || '' }}
          INPUT_FOCUS_STORE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.focus_store || env.DEFAULT_FOCUS_STORE }}
        run: |
          extra_args=()
          if [ -n "${INPUT_STORES}" ]; then
            extra_args+=(--stores "${INPUT_STORES}")
          fi
          if [ "${INPUT_WINDOW_PRESET}" = "custom" ]; then
            extra_args+=(--start "${INPUT_CUSTOM_START}" --end "${INPUT_CUSTOM_END}")
          fi

          python scripts/manual/extract_metrics_window.py \
            --window-preset "${INPUT_WINDOW_PRESET}" \
            --focus-store "${INPUT_FOCUS_STORE}" \
            "${extra_args[@]}"

      - name: Upload extraction artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-window-extract-${{ github.run_id }}
          path: |
            output/
            state.json
          if-no-files-found: warn
          retention-days: 14

      - name: Write extraction summary
        if: always()
        env:
          GATE_CURRENT_UK_TIME: ${{ needs.check-time.outputs.current_uk_time }}
          GATE_REASON: ${{ needs.check-time.outputs.gate_reason }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from core.reporting import build_github_step_summary_markdown

          gate_reason = os.getenv("GATE_REASON", "")
          gate_time = os.getenv("GATE_CURRENT_UK_TIME", "")
          summary_path = Path("output/run_summary.json")
          if summary_path.exists():
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
              markdown = build_github_step_summary_markdown(
                  summary,
                  gate_reason=gate_reason,
                  gate_hour=gate_time,
              )
          else:
              markdown = "\n".join(
                  [
                      "## Metrics Window Extract",
                      "",
                      "Runtime summary was not generated. Check the extraction logs and uploaded artifacts.",
                      "",
                  ]
              )

          focus_summary_path = Path("output/focus_store_summary.md")
          if focus_summary_path.exists():
              markdown += "\n" + focus_summary_path.read_text(encoding="utf-8")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(markdown)
          PY
